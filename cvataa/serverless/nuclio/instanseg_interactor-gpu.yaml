metadata:
  name: pth-instanseg_interactor
  namespace: cvat
  annotations:
    name: InstanSeg (interactive)
    version: 2
    type: interactor
    spec:
    min_pos_points: 0
    min_neg_points: 0
    startswith_box_optional: true

spec:
  description: Interactive Cell Segmentation with InstanSeg
  runtime: 'python:3.10'
  handler: instanseg_gui:handler
  eventTimeout: 30s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio/instanseg

  build:
    image: cvat.pth.instanseg_interactor:latest-gpu
    baseImage: ubuntu:22.04

    directives:
      preCopy:
      # set NVIDIA container runtime settings
        - kind: ENV
          value: NVIDIA_VISIBLE_DEVICES=all
        - kind: ENV
          value: NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # set workdir
        - kind: WORKDIR
          value: /opt/nuclio/instanseg
      # install basic deps
        - kind: RUN
          value: apt-get update && apt-get -y install wget curl git python3 python3-pip python-is-python3 ffmpeg libsm6 libxext6 && rm -rf /var/lib/apt/lists/*
      # set up debugging
        - kind: RUN
          value: pip3 install debugpy
        - kind: RUN
          value: apt update && apt install -y ssh nano
        - kind: RUN
          value: ssh-keygen -q -t rsa -N '' -C "microsam" -f /root/.ssh/id_rsa
        - kind: RUN
          value: echo "Host x99\nUser abhineet\nHostName 192.168.1.138\nPort 3152\n" >> /root/.ssh/config
      # clone custom instanseg
        - kind: RUN
          value: git clone https://github.com/abhineet123/instanseg
      # install instanseg
        - kind: RUN
          value: cd instanseg && pip3 install -e .
        - kind: RUN
          value: pip3 install numpy==1.26.4 opencv-python==4.8.0.76

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 1000
      port: 12346
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
