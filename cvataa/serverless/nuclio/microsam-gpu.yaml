metadata:
  name: pth-microsam
  namespace: cvat
  annotations:
    name: MicroSAM (ViT-Tiny)
    version: 2
    type: interactor
    spec:
    min_pos_points: 0
    min_neg_points: 0
    startswith_box: true

spec:
  description: MicroSAM (ViT-Tiny)
  runtime: 'python:3.12'
  handler: microsam_gui:handler
  eventTimeout: 300s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio/microsam

  build:
    image: cvat.pth.microsam:latest-gpu
    baseImage: ubuntu:22.04

    directives:
      preCopy:
      # set NVIDIA container runtime settings
        - kind: ENV
          value: NVIDIA_VISIBLE_DEVICES=all
        - kind: ENV
          value: NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # disable interactive frontend
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
      # set microsam variant
        - kind: ENV
          value: MICROSAM_VARIANT=vit_t_lm
      # set workdir
        - kind: WORKDIR
          value: /opt/nuclio/microsam
      # install basic deps
        - kind: RUN
          value: apt-get update && apt-get -y install ssh nano wget git ffmpeg libsm6 libxext6 && rm -rf /var/lib/apt/lists/*
        # - kind: RUN
          # value: test_break

      # set up debugging
        # - kind: RUN
        #   value: apt update && apt install -y ssh nano
        # - kind: RUN
        #   value: ssh-keygen -q -t rsa -N '' -C "microsam" -f /root/.ssh/id_rsa
        # - kind: RUN
        #   value: echo "Host x99\nUser abhineet\nHostName 192.168.1.138\nPort 3152\n" >> /root/.ssh/config

      # install conda
        - kind: RUN
          value: wget https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
        - kind: RUN
          value: bash Miniforge3-Linux-x86_64.sh -b
        - kind: RUN
          value: .  /root/miniforge3/bin/activate
        - kind: RUN
          value:  /root/miniforge3/condabin/conda init
        # - kind: RUN
          # value: . /root/.bashrc
        # - kind: RUN
          # value: echo $0
        - kind: ENV
          value: PATH=$PATH:/root/miniforge3/condabin
        - kind: RUN
          value: which conda
      # install microsam
        - kind: RUN
          value: conda create -n microsam_conda python=3.12
        - kind: ENV
          value: PATH=$PATH:/root/miniforge3/envs/microsam_conda/bin
        - kind: RUN
          value: which python
        - kind: RUN
          value: ln -sf /root/miniforge3/envs/microsam_conda/bin/python /usr/bin/python
        - kind: RUN
          value: ln -sf /root/miniforge3/envs/microsam_conda/bin/python3 /usr/bin/python3
        - kind: RUN
          value: python -V
        # - kind: RUN
        #   value: python -m pip install nuclio-sdk
        # - kind: RUN
        #   value: python -c 'import nuclio_sdk'
        - kind: RUN
          value: git clone https://github.com/abhineet123/microsam_private microsam
        - kind: RUN
          # value: cd microsam && conda env create -f environment.yaml
          value: cd microsam && conda env update -n microsam_conda --file environment.yaml
          # value: cd microsam && conda env update -n base --file environment.yaml
        # - kind: RUN
          # value: nazio
        - kind: RUN
          value: cd microsam && python -m pip install -e .
        - kind: RUN
          value: python -c 'from micro_sam.prompt_based_segmentation import segment_from_box'
        - kind: RUN
          value: python -m pip install paramparse cvat-cli opencv-python

  triggers:
    myHttpTrigger:
      numWorkers: 1
      maxWorkers: 1
      port: 12347
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        # Set value from the calculation of tracking of 100 objects at the same time on a 4k image
        maxRequestBodySize: 268435456 # 256MB
  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
