metadata:
  name: pth-cellpose
  namespace: cvat
  annotations:
    name: cellpose
    version: 2
    type: detector
    spec: |
      [
        { "id": 1, "name": "nucleus", "type": "mask" }
      ]

spec:
  description: Cell Segmentation with CellPose-SAM
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 30s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio/cellpose

  build:
    image: cvat.pth.cellpose:latest-gpu
    baseImage: ubuntu:22.04

    directives:
      preCopy:
      # set NVIDIA container runtime settings
        - kind: ENV
          value: NVIDIA_VISIBLE_DEVICES=all
        - kind: ENV
          value: NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # set workdir
        - kind: WORKDIR
          value: /opt/nuclio/cellpose
      # install basic deps
        - kind: RUN
          value: apt-get update && apt-get -y install unzip wget curl git python3 python3-pip python-is-python3 ffmpeg libsm6 libxext6 && rm -rf /var/lib/apt/lists/*
      # install cellpose
        - kind: RUN
          value: pip install torch==2.2.2 torchvision==0.17.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cu121
        - kind: RUN
          value: pip install scikit-image
        - kind: RUN
          value: git clone https://github.com/abhineet123/cellpose
        - kind: RUN
          value: cd cellpose && pip install -r requirements.txt
        - kind: RUN
          value: cd cellpose && python -m pip install -e .
      # set workdir
        # - kind: WORKDIR
          # value: /opt/nuclio/cellpose/cellpose

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 1000
      port: 12348
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
