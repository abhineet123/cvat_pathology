metadata:
  name: pth-cellvit
  namespace: cvat
  annotations:
    name: CellVIT
    version: 2
    type: detector
    spec: |
      [
        { "id": 1, "name": "nucleus", "type": "mask" }
      ]

spec:
  description: Cell Segmentation with CellVIT-SAM
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 6000s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio/cellvit

  build:
    image: cvat.pth.cellvit
    baseImage: ubuntu:22.04

    directives:
      preCopy:
      # disable interactive frontend
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
      # set workdir
        - kind: WORKDIR
          value: /opt/nuclio/cellvit
      # install basic deps
        - kind: RUN
          value: apt-get update && apt-get -y install unzip curl git python3.11 python3.11 pip python-is-python3 ffmpeg libsm6 libxext6 && rm -rf /var/lib/apt/lists/*
      # set up debugging
        - kind: RUN
          value: pip3 install debugpy
      # clone custom cellvit
        - kind: RUN
          value: git clone https://github.com/abhineet123/cellvit_pp
      # install cellvit requirements
        - kind: RUN
          value: cd cellvit_pp && pip3 install -r requirements.txt
        - kind: RUN
          value: pip3 install --upgrade timm wandb Numba scipy tensorflow scikit-image pandas torch torchvision torchaudio
        - kind: RUN
          value: pip3 uninstall -y opencv-python-headless
        - kind: RUN
          value: pip3 install --upgrade opencv-python
      # setup cellvit-sam pretrained model
        - kind: RUN
          value: cd cellvit_pp && mkdir pretrained
        - kind: RUN
          value: cd cellvit_pp/pretrained && wget https://huggingface.co/abhineet123/cellvit/resolve/main/pretrained/SAM.zip
        - kind: RUN
          value: cd cellvit_pp/pretrained && unzip SAM.zip
      # add cellvit to PYTHONPATH
        - kind: ENV
          value: PYTHONPATH=/opt/nuclio/cellvit/cellvit_pp


  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 1000
      port: 12345
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
