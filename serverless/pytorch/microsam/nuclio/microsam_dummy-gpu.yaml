metadata:
  name: pth-microsam
  namespace: cvat
  annotations:
    name: MicroSAM (Light Microscopy ViT-Tiny)
    version: 2
    # type: tracker
    type: interactor
    spec:
    min_pos_points: 0
    min_neg_points: 0
    startswith_box: true

spec:
  description: MicroSAM (Light Microscopy ViT-Tiny)
  runtime: 'python:3.12'
  handler: main:handler
  eventTimeout: 300s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio/microsam

  build:
    image: cvat.pth.microsam:latest-gpu
    baseImage: ubuntu:22.04

    directives:
      preCopy:
      # set NVIDIA container runtime settings
        - kind: ENV
          value: NVIDIA_VISIBLE_DEVICES=all
        - kind: ENV
          value: NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # disable interactive frontend
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
      # set workdir
        - kind: WORKDIR
          value: /opt/nuclio/microsam
      # install basic deps
        - kind: RUN
          # value: apt-get update && apt-get -y install net-tools
          # value: apt-get update >> nuctl_outputs.log
          value: apt-get update 2>> nuctl_outputs.log && apt-get -y install net-tools wget curl git python3 python3-pip python-is-python3 ffmpeg libsm6 libxext6 2>> nuctl_outputs.log && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: ifconfig
        - kind: RUN
          value: test

  triggers:
    myHttpTrigger:
      numWorkers: 1
      maxWorkers: 1
      port: 12347
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        # Set value from the calculation of tracking of 100 objects at the same time on a 4k image
        maxRequestBodySize: 268435456 # 256MB
  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
